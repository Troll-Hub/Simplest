name: Build desde ZIP

on:
  push:
    paths:
      - 'inbox/*.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Ruta del zip en el repo'
        required: false
        default: 'inbox/SaveEditor.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INPUT_ZIP: ${{ github.event.inputs.zip_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir ZIP y localizar el proyecto
        run: |
          ZIP="${INPUT_ZIP:-$(ls inbox/*.zip | head -n1)}"
          echo "Usando zip: $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          if [ -z "$SETTINGS" ]; then echo "No se encontró settings.gradle en el zip"; exit 1; fi
          echo "PROJ=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: |
          cd "$PROJ"
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
