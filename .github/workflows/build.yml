name: build-simplehorizon

on:
  push:
    paths:
      - 'Simple*.zip'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-simplehorizon.yml'
      - 'app/**'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Avoid the removed SDK package "tools". It caused the logged failure.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or extract project
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          SETTINGS_FILE="$(find "$WORKSPACE" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -print -quit || true)"

          if [[ -n "$SETTINGS_FILE" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            ZIP="$(find "$WORKSPACE" -maxdepth 2 -type f -name 'Simple*.zip' -print | sort | tail -n 1 || true)"
            if [[ -z "$ZIP" ]]; then
              ZIP="$(find "$WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print | sort | tail -n 1 || true)"
            fi
            if [[ -z "$ZIP" ]]; then
              echo "ERROR: No Gradle project or source ZIP was found in the repository." >&2
              exit 1
            fi

            DEST="$RUNNER_TEMP/simplehorizon-src"
            mkdir -p "$DEST"
            echo "Extracting: $ZIP"
            unzip -q -o "$ZIP" -d "$DEST"

            SETTINGS_FILE="$(find "$DEST" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: ZIP does not contain settings.gradle or settings.gradle.kts." >&2
              find "$DEST" -maxdepth 3 -type f | head -100
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and native helper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "ERROR: assembleRelease finished but no release APK was found." >&2
            exit 1
          fi
          echo "APK generated: $APK"
          if unzip -l "$APK" | grep -E 'libtouchremap|classes'; then
            echo "APK contents checked."
          else
            echo "WARNING: Could not find expected native helper or classes in APK listing."
          fi
          mkdir -p "$RUNNER_TEMP/simplehorizon-apk"
          cp "$APK" "$RUNNER_TEMP/simplehorizon-apk/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-apk
          path: ${{ runner.temp }}/simplehorizon-apk/*.apk
          if-no-files-found: error
          retention-days: 14
