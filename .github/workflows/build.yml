name: build-simplehorizon

on:
  push:
    paths:
      - 'SimpleHorizon-2.3.0-source.zip'
      - 'Simple*.zip'
      - 'SimpleHorizon-2.3.0-project/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-simplehorizon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build SimpleHorizon APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simplehorizon-src"

          # Prefer an already-extracted Gradle project if one is present.
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -print -quit || true)"
          if [[ -n "$SETTINGS_FILE" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            ZIP="$(find . -maxdepth 2 -type f -name 'Simple*.zip' -print | sort | tail -n 1 || true)"
            if [[ -z "$ZIP" ]]; then
              ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print | sort | tail -n 1 || true)"
            fi
            if [[ -z "$ZIP" ]]; then
              echo 'ERROR: No Gradle project or source ZIP was found.' >&2
              exit 1
            fi
            echo "Extracting source archive: $ZIP"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/simplehorizon-src"
            SETTINGS_FILE="$(find "$RUNNER_TEMP/simplehorizon-src" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo 'ERROR: ZIP does not contain settings.gradle(.kts).' >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app Gradle file not found in $PROJECT_DIR" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and native touch helper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo 'ERROR: Release APK was not produced.' >&2
            exit 1
          fi
          echo "APK produced: $APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtouchremap.so'; then
            echo 'Verified: arm64 touch remapping library is packaged.'
          else
            echo 'WARNING: arm64 libtouchremap.so was not found in the APK.'
            unzip -l "$APK" | grep -E 'lib/.*\.so$' || true
          fi
          mkdir -p "$RUNNER_TEMP/simplehorizon-apk"
          cp "$APK" "$RUNNER_TEMP/simplehorizon-apk/"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-2.3.0-apk
          path: ${{ runner.temp }}/simplehorizon-apk/*.apk
          if-no-files-found: error
          retention-days: 14
