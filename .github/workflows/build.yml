name: Build SimpleHorizon

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip Simple*.zip
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name 'Simple*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No Simple*.zip found, building current tree"
            echo "SRC_DIR=." >> $GITHUB_ENV
          else
            echo "Found $ZIP"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            ROOT=$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'gradlew' \) | head -n 1 | xargs -r dirname)
            if [ -z "$ROOT" ]; then ROOT=extracted; fi
            echo "SRC_DIR=$ROOT" >> $GITHUB_ENV
            echo "Using project at $ROOT"
            ls -la "$ROOT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-debug
          path: |
            ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
