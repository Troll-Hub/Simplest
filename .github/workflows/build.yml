name: build-simplehorizon

on:
  push:
    paths:
      - 'SimpleHorizon-2.3.0-source.zip'
      - 'Simple*.zip'
      - 'SimpleHorizon-2.3.0-project/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-simplehorizon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simplehorizon-src"
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -print -quit || true)"
          if [[ -n "$SETTINGS_FILE" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            ZIP="$(find . -maxdepth 2 -type f -name 'Simple*.zip' -print | sort | tail -n 1 || true)"
            if [[ -z "$ZIP" ]]; then ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print | sort | tail -n 1 || true)"; fi
            if [[ -z "$ZIP" ]]; then echo 'No Gradle project or ZIP found' >&2; exit 1; fi
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/simplehorizon-src"
            SETTINGS_FILE="$(find "$RUNNER_TEMP/simplehorizon-src" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then echo 'Gradle settings file not found in ZIP' >&2; exit 1; fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify and stage APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -E 'libtouchremap|classes' || true
          mkdir -p "$RUNNER_TEMP/simplehorizon-apk"
          cp "$APK" "$RUNNER_TEMP/simplehorizon-apk/"
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-2.3.0-apk
          path: ${{ runner.temp }}/simplehorizon-apk/*.apk
          if-no-files-found: error
          retention-days: 14
