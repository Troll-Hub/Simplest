name: Build Android Project
​on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Find and unzip Simple*.zip
run: |
ZIP_FILE=$(find . -maxdepth 2 -name "Simple*.zip" | head -n 1)
if [ -n "$ZIP_FILE" ]; then
echo "Descomprimiendo $ZIP_FILE..."
unzip -o "$ZIP_FILE" -d .
else
echo "No se encontró ningún archivo zip que comience por Simple"
fi
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
​- name: Grant execute permission for gradlew
run: chmod +x gradlew
working-directory: ./HorizonVirtual
​- name: Build Debug APK
run: ./gradlew assembleDebug
working-directory: ./HorizonVirtual
​- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: app-debug
path: HorizonVirtual/app/build/outputs/apk/debug/app-debug.apk
