name: Build Horizon Virtual

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here: its current run is
      # attempting to install the obsolete SDK package named "tools".
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "ERROR: Android SDK command-line tools not found at $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found in $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -not -path '*/.git/*' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No .zip file found in the repository. Upload the project ZIP and run the workflow again." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/horizon-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/horizon-project"
          PROJECT_DIR="$(find "$RUNNER_TEMP/horizon-project" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: ZIP extracted, but no settings.gradle or settings.gradle.kts was found." >&2
            find "$RUNNER_TEMP/horizon-project" -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at: $PROJECT_DIR"

      - name: Build release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonVirtual-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
