name: Build SimpleHorizon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q SimpleHorizon-1_2_1-diagnostico.zip -d src

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Licencias y plataforma 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK release
        working-directory: src/SimpleHorizon-1.2.1
        run: gradle :app:assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-release
          path: src/SimpleHorizon-1.2.1/app/build/outputs/apk/release/*.apk
