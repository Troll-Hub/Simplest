name: build-simplehorizon
on:
  push:
    paths: ['Simple*.zip', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(ls -t Simple*.zip 2>/dev/null | head -1); [ -z "$ZIP" ] && ZIP=$(ls -t *.zip | head -1)
          echo "Usando $ZIP"
          mkdir -p src && unzip -q -o "$ZIP" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar que el ayudante táctil quedó en el APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "libtouchremap|classes" || echo "AVISO: libtouchremap.so no está en el APK"

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
