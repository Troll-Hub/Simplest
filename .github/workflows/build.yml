name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descomprimir el Simple*.zip más reciente
        run: |
          ZIP=""; BEST=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -ge "$BEST" ]; then BEST=$t; ZIP=$f; fi
          done < <(find . -maxdepth 2 -type f -name 'Simple*.zip' -not -path './.git/*')
          if [ -z "$ZIP" ]; then echo "No se encontró ningún Simple*.zip"; exit 1; fi
          echo "Usando: $ZIP"
          rm -rf src_unzipped
          unzip -q -o "$ZIP" -d src_unzipped
          PROJ=$(dirname "$(find src_unzipped -name settings.gradle.kts | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          # los PNG vacíos (0 bytes) rompen la compilación de recursos
          find "$PROJ" -type f -name '*.png' -size 0 -delete

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar plataforma y build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
