name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el zip Simple*.zip
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'Simple*.zip' | head -1)
          if [ -z "$ZIP" ]; then echo "No se encontró ningún Simple*.zip"; exit 1; fi
          echo "Usando: $ZIP"
          unzip -q -o "$ZIP" -d src_unzipped
          PROJ=$(dirname "$(find src_unzipped -name settings.gradle.kts | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          # los PNG vacíos (0 bytes) rompen la compilación de recursos
          find "$PROJ" -type f -name '*.png' -size 0 -delete

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleHorizon-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
